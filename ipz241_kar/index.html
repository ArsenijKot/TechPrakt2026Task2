<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новини дня</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Останні новини</h1>
</header>

<main class="news-container">

  <article class="news-card">
    <img src="images/news-1.png" alt="Новина 1">
    <div class="news-content">
      <h2>Технології майбутнього</h2>
      <p>
        Нові розробки у сфері штучного інтелекту активно змінюють сучасний світ.
      </p>
    </div>
  </article>
  <article class="news-card">
    <img src="images/news-2.png" alt="Новина 2">
    <div class="news-content">
      <h2>Спортивні досягнення</h2>
      <p>
        Українські спортсмени здобули перемоги на міжнародних змаганнях.
      </p>
    </div>
  </article>

  <article class="news-card">
    <img src="images/news-3.png" alt="Новина 3">
    <div class="news-content">
      <h2>Подорожі та туризм</h2>
      <p>
        Літній сезон відкриває нові можливості для мандрівок Україною.
      </p>
    </div>
  </article>

</main>

</body>
</html>
