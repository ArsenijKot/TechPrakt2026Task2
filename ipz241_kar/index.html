<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новини України та світу</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Головні новини сьогодні</h1>
</header>

<main class="news-container">

    <article class="news-card">
        <img src="images/news-1.png" alt="Технології">
        <div class="news-content">
            <h2>Світ технологій</h2>
            <p>
                Штучний інтелект та сучасні розробки змінюють підхід до роботи та навчання.
            </p>
        </div>
    </article>

    <article class="news-card">
        <img src="images/news-2.png" alt="Спорт">
        <div class="news-content">
            <h2>Новини спорту</h2>
            <p>
                Українські спортсмени продовжують здобувати медалі на міжнародній арені.
            </p>
        </div>
    </article>

    <article class="news-card">
        <img src="images/news-3.png" alt="Подорожі">
        <div class="news-content">
            <h2>Туризм і подорожі</h2>
            <p>
                Все більше українців обирають активний відпочинок та мандрівки країною.
            </p>
        </div>
    </article>

</main>

</body>
</html>
