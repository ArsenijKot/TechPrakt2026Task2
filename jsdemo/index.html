<!DOCTYPE html>
<html lang="uk">
<head>
    <script defer src="js/main.js"></script>
    <script defer src="js/index.js"></script>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Panels</title>
</head>
<body>

<div class="panel" id="one">
    <div class="header">
        <div class="title">Technology News</div>
    </div>

    <div class="content">
        <p>
            Нові технології активно змінюють сучасний світ та відкривають нові можливості.
        </p>
    </div>
</div>

<div class="panel">
    <div class="header">
        <div class="title">Sport Updates</div>
    </div>

    <div class="content">
        <p>
            Українські спортсмени продовжують демонструвати високі результати.
        </p>
    </div>
</div>

<div class="panel">
    <div class="header">
        <div class="title">Travel Blog</div>
    </div>

    <div class="content">
        <p>
            Літній сезон — чудова можливість для нових подорожей та пригод.
        </p>
    </div>
</div>

</body>
</html>
